name: Mirror Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - 'scripts/ci-images-matrix.sh'
      - 'scripts/scan/**'
      - 'security/**'
      - '.github/workflows/images.yaml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image matrix
        id: matrix
        run: |
          chmod +x scripts/ci-images-matrix.sh
          echo "matrix=$(./scripts/ci-images-matrix.sh)" >> "$GITHUB_OUTPUT"

  mirror:
    runs-on: ubuntu-24.04
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read image tag
        id: tag
        run: |
          tag=$(grep -E '^ARG VERSION=' "${{ matrix.context }}/Dockerfile" | head -1 | sed 's/^ARG VERSION=//')
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:latest
            ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
            ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:${{ github.sha }}

  scan:
    runs-on: ubuntu-24.04
    needs: [mirror, prepare]
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
      SCAN_ENFORCE_GATE: "0"
      TRIVY_DB_REPOSITORY: public.shturval.tech/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.shturval.tech/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.76.0

      - name: Cache BDU vulxml
        uses: actions/cache@v4
        with:
          path: .cache/bdu
          key: bdu-vulxml-${{ hashFiles('scripts/scan/bdu-fetch.sh') }}
          restore-keys: |
            bdu-vulxml-

      - name: Fetch BDU database
        run: ./scripts/scan/bdu-fetch.sh

      - name: Scan image (Trivy + BDU)
        id: scan
        continue-on-error: true
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/trivy-scan.sh \
            "ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:${{ github.sha }}" \
            "${{ matrix.name }}"

      - name: Upload SARIF
        if: always() && steps.scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dist/scan/${{ matrix.name }}/report.sarif
          category: trivy-${{ matrix.name }}

      - name: Record scan job outcome
        if: always()
        run: |
          chmod +x scripts/scan/write-scan-meta.sh
          ./scripts/scan/write-scan-meta.sh \
            "${{ matrix.name }}" "${{ steps.scan.outcome }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.run_id }}" "${{ github.job }}"

      - name: Upload scan artifacts
        if: always() && steps.scan.outcome != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            dist/scan/${{ matrix.name }}/report.json
            dist/scan/${{ matrix.name }}/report.bdu.json
            dist/scan/${{ matrix.name }}/report.bdu.md
            dist/scan/${{ matrix.name }}/report.cyclonedx.json
            dist/scan/scan-meta/${{ matrix.name }}.json

      - name: Scan summary
        if: always()
        run: |
          if [[ -f "dist/scan/${{ matrix.name }}/report.bdu.md" ]]; then
            cat "dist/scan/${{ matrix.name }}/report.bdu.md" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Scan report missing for ${{ matrix.name }}" >> "${GITHUB_STEP_SUMMARY}"
          fi

  scan-gate:
    runs-on: ubuntu-24.04
    needs: [mirror, scan, prepare]
    if: always() && needs.mirror.result == 'success' && needs.scan.result != 'cancelled' && needs.scan.result != 'skipped'
    steps:
      - uses: actions/checkout@v4

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          merge-multiple: true
          path: artifact

      - name: Prepare dist/scan
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/prepare-dist-scan-from-artifacts.sh artifact dist/scan
          ./scripts/scan/aggregate-report.sh

      - name: Enforce scan policy gate
        env:
          SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
        run: ./scripts/scan/enforce-gate.sh dist/scan

  publish-pages:
    needs: [mirror, scan, prepare]
    if: always() && needs.mirror.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scan-*
          merge-multiple: true
          path: artifact

      - name: Prepare dist/scan
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/prepare-dist-scan-from-artifacts.sh artifact dist/scan
          ./scripts/scan/aggregate-report.sh

      - name: Build GitHub Pages bundle
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_SOURCE: Mirror Images
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./scripts/scan/publish-pages.sh

      - name: Deploy to GitHub Pages (security/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/scan/pages
          destination_dir: security
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore(security): update scan report [skip ci]"
