name: Mirror Images

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: keycloak
            context: images/keycloak
          - name: cloudnative-pg
            context: images/cloudnative-pg
          - name: mariadb-operator
            context: images/mariadb-operator
          - name: mariadb
            context: images/mariadb
          - name: strimzi-operator
            context: images/strimzi-operator
          - name: redis-operator
            context: images/redis-operator
          - name: rabbitmq
            context: images/rabbitmq
          - name: minio
            context: images/minio
          - name: authentik
            context: images/authentik
          - name: proxmox-csi
            context: images/proxmox-csi
          - name: nextcloud-aio
            context: images/nextcloud-aio
          - name: redis
            context: images/redis
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:latest
            ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:${{ github.sha }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/shturval-tech/community-marketplace/${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0
