# Synced from vendored subchart defaults + community-marketplace overrides.
# Regenerate: make sync-values (after scripts/vendor-chart-deps.sh)
global:
  imageRegistry: ghcr.io/shturval-tech/community-marketplace
  storageClass: ''
  ingress:
    className: ''
strimzi-kafka-operator:
  replicas: 1
  watchNamespaces: []
  watchAnyNamespace: false
  defaultImageRegistry: ghcr.io/shturval-tech/community-marketplace
  defaultImageRepository: ''
  defaultImageTag: 1.3.0
  image:
    registry: ghcr.io/shturval-tech/community-marketplace
    repository: strimzi-operator
    name: ''
    tag: 1.3.0
  logVolume: co-config-volume
  logConfigMap: strimzi-cluster-operator
  logConfiguration: ''
  logLevel: ${env:STRIMZI_LOG_LEVEL:-INFO}
  fullReconciliationIntervalMs: 120000
  operationTimeoutMs: 300000
  kubernetesServiceDnsDomain: cluster.local
  featureGates: ''
  tmpDirSizeLimit: 1Mi
  extraEnvs: []
  tolerations: []
  topologySpreadConstraints: []
  affinity: {}
  annotations: {}
  labels: {}
  nodeSelector: {}
  deploymentAnnotations: {}
  deploymentLabels: {}
  deploymentStrategy: {}
  priorityClassName: ''
  hostUsers: null
  enableServiceLinks: null
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  rbac:
    create: true
  serviceAccountCreate: true
  serviceAccount: strimzi-cluster-operator
  leaderElection:
    enable: true
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    maxUnavailable: null
    unhealthyPodEvictionPolicy: IfHealthyBudget
  operatorNetworkPolicy:
    enabled: false
    ingress:
    - ports:
      - protocol: TCP
        port: http
    egress:
    - {}
  dashboards:
    enabled: false
    namespace: null
    label: grafana_dashboard
    labelValue: '1'
    annotations: {}
    extraLabels: {}
  kafka:
    image:
      registry: ghcr.io/shturval-tech/community-marketplace
      repository: strimzi-kafka
      name: ''
      tagPrefix: ''
      tag: 1.3.0-kafka-4.2.2
  kafkaConnect:
    image:
      registry: ''
      repository: ''
      name: kafka
      tagPrefix: ''
  topicOperator:
    image:
      registry: ''
      repository: ''
      name: operator
      tag: ''
  userOperator:
    image:
      registry: null
      repository: null
      name: operator
      tag: ''
  kafkaInit:
    image:
      registry: ''
      repository: ''
      name: operator
      tag: ''
  kafkaBridge:
    image:
      registry: ''
      repository: null
      name: kafka-bridge
      tag: 0.31.1
  kafkaExporter:
    image:
      registry: ''
      repository: ''
      name: kafka
      tagPrefix: ''
  kafkaMirrorMaker2:
    image:
      registry: ''
      repository: ''
      name: kafka
      tagPrefix: ''
  cruiseControl:
    image:
      registry: ''
      repository: ''
      name: kafka
      tagPrefix: ''
  buildah:
    image:
      registry: ''
      repository: ''
      name: buildah
      tag: ''
  mavenBuilder:
    image:
      registry: ''
      repository: ''
      name: maven-builder
      tag: ''
  resources:
    limits:
      memory: 384Mi
      cpu: 1000m
    requests:
      memory: 384Mi
      cpu: 200m
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
  createGlobalResources: true
  createAggregateRoles: false
  labelsExclusionPattern: ''
  generateNetworkPolicy: true
  connectBuildTimeoutMs: 300000
  generatePodDisruptionBudget: true
  kafkaMirrorMaker:
    image:
      registry: ''
      repository: ''
      name: kafka
      tagPrefix: ''
  kanikoExecutor:
