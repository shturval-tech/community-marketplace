# RabbitMQ Cluster Operator deployment (standalone manifest chart).
global:
  imageRegistry: ghcr.io/shturval-tech/community-marketplace

replicas: 1

image:
  repository: rabbitmq-operator
  tag: "2.12.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: rabbitmq-cluster-operator
