name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan-all:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
      TRIVY_DB_REPOSITORY: public.shturval.tech/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.shturval.tech/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.1
        with:
          version: v0.76.0

      - name: Cache BDU vulxml
        uses: actions/cache@v4
        with:
          path: .cache/bdu
          key: bdu-vulxml-${{ hashFiles('scripts/scan/bdu-fetch.sh') }}
          restore-keys: |
            bdu-vulxml-

      - name: Fetch BDU database
        run: ./scripts/scan/bdu-fetch.sh

      - name: Scan all mirrored images
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/trivy-scan.sh all

      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          path: dist/scan/

      - name: Summary
        if: always()
        run: |
          if [[ -f dist/scan/REPORT.md ]]; then
            cat dist/scan/REPORT.md >> "${GITHUB_STEP_SUMMARY}"
          fi
