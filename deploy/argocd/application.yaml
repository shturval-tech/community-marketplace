apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shturval-community-repoconfig
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shturval-community-marketplace
spec:
  project: default
  source:
    repoURL: https://github.com/shturval-tech/community-marketplace.git
    targetRevision: main
    path: deploy/repoconfig/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
