apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.name }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafkaVersion | quote }}
    metadataVersion: {{ .Values.metadataVersion | quote }}
    image: {{ .Values.global.imageRegistry }}/strimzi-kafka:{{ .Values.kafkaImageTag }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config: {{- toYaml .Values.kafkaConfig | nindent 6 }}
  entityOperator: {{- toYaml .Values.entityOperator | nindent 4 }}
