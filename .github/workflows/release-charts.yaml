name: Release Charts

concurrency: chart_releaser

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release-charts.yaml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Add Helm chart repositories
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add mariadb https://helm.mariadb.com/mariadb-operator
          helm repo add minio-op https://operator.min.io/
          helm repo add keycloakx https://codecentric.github.io/helm-charts
          helm repo add authentik https://charts.goauthentik.io
          helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
          helm repo update

      - name: Ensure Strimzi subchart is vendored
        run: ./scripts/vendor-chart-deps.sh

      - name: Package charts
        id: package
        run: |
          mkdir -p .cr-release-packages
          shopt -s nullglob
          for d in charts/*/; do
            helm package "$d" -d .cr-release-packages --dependency-update=false
          done
          ls -la .cr-release-packages/
          echo "package_count=$(ls -1 .cr-release-packages/*.tgz 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Bootstrap gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            git checkout --orphan gh-pages
            git reset --hard
            echo "# Helm chart index (community-marketplace)" > README.md
            git add README.md
            git commit -m "Initialize gh-pages for Helm repository"
            git push origin gh-pages
            git checkout -
          fi

      - name: Publish chart packages and index to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          rm -rf gh-pages-work
          git worktree add gh-pages-work origin/gh-pages
          cp .cr-release-packages/*.tgz gh-pages-work/
          cd gh-pages-work
          if [[ -f index.yaml ]]; then
            helm repo index . --merge index.yaml
          else
            helm repo index .
          fi
          git add index.yaml *.tgz
          if git diff --staged --quiet; then
            echo "No gh-pages changes"
          else
            git commit -m "Publish Helm charts from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
          cd ..
          git worktree remove gh-pages-work

      - name: Login to GitHub Container Registry
        if: steps.package.outputs.package_count != '0'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Charts to GHCR
        if: steps.package.outputs.package_count != '0'
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            helm push "${pkg}" "oci://ghcr.io/${{ github.repository }}"
          done
