# Synced from vendored subchart defaults + community-marketplace overrides.
# Regenerate: make sync-values (after scripts/vendor-chart-deps.sh)
global:
  imageRegistry: ghcr.io/shturval-tech/community-marketplace
  storageClass: ''
  ingress:
    className: ''
operator:
  operator:
    env:
    - name: OPERATOR_STS_ENABLED
      value: 'on'
    serviceAccountAnnotations: []
    additionalLabels: {}
    image:
      repository: ghcr.io/shturval-tech/community-marketplace/minio-operator
      tag: v7.1.1
      pullPolicy: IfNotPresent
    sidecarImage: {}
    imagePullSecrets: []
    runtimeClassName: null
    initContainers: []
    replicaCount: 2
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    volumes: []
    volumeMounts: []
    nodeSelector: {}
    priorityClassName: ''
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: name
              operator: In
              values:
              - minio-operator
          topologyKey: kubernetes.io/hostname
    tolerations: []
    topologySpreadConstraints: []
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
        ephemeral-storage: 500Mi
