name: Lint and Test Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ct.yaml'
      - '.github/workflows/lint-test.yaml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'ct.yaml'

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Add Helm chart repositories
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add mariadb https://helm.mariadb.com/mariadb-operator
          helm repo add minio-op https://operator.min.io/
          helm repo add keycloakx https://codecentric.github.io/helm-charts
          helm repo add authentik https://charts.goauthentik.io
          helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
          helm repo update

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Run chart-testing (lint)
        run: ct lint --target-branch "${{ github.event.repository.default_branch }}"

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Kubeconform rendered manifests
        run: |
          for chart in charts/*/; do
            name=$(basename "$chart")
            if [[ ! -f "$chart/Chart.yaml" ]]; then continue; fi
            helm template "test-$name" "$chart" -f "$chart/ci/test-values.yaml" 2>/dev/null | kubeconform -summary -ignore-missing-schemas || true
          done

  install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        chart:
          - cnpg-operator
          - cnpg-cluster
          - mariadb-operator
          - mariadb
          - redis-operator
          - redis
          - rabbitmq-operator
          - rabbitmq
          - strimzi-operator
          - kafka
          - minio-operator
          - minio-tenant
          - keycloak
          - authentik
          - proxmox-csi
          - nextcloud-aio
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Add Helm chart repositories
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add mariadb https://helm.mariadb.com/mariadb-operator
          helm repo add minio-op https://operator.min.io/
          helm repo add keycloakx https://codecentric.github.io/helm-charts
          helm repo add authentik https://charts.goauthentik.io
          helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
          helm repo update

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0

      - name: Install chart
        run: |
          ct install --charts "charts/${{ matrix.chart }}" \
            --helm-extra-set-args "--values charts/${{ matrix.chart }}/ci/test-values.yaml" \
            --target-branch "${{ github.event.repository.default_branch }}"
