name: Publish Security Pages

# Ручной перезапуск публикации по одному артефакту security-scan-report
# (основная публикация — job publish-pages в Security Scan / Mirror Images).

on:
  workflow_dispatch:
    inputs:
      workflow_run_id:
        description: ID run workflow Security Scan (с артефактом security-scan-report)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download security-scan-report artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.workflow_run_id }}
          name: security-scan-report
          path: dist/scan

      - name: Build GitHub Pages bundle
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.workflow_run_id }}
          SCAN_SOURCE: manual
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/publish-pages.sh

      - name: Deploy to GitHub Pages (security/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/scan/pages
          destination_dir: security
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore(security): update scan report [skip ci]"
