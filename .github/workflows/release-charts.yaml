name: Release Charts

concurrency: chart_releaser

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/release-charts.yaml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.2

      - name: Add Helm chart repositories
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add mariadb https://helm.mariadb.com/mariadb-operator
          helm repo add minio-op https://operator.min.io/
          helm repo add keycloakx https://codecentric.github.io/helm-charts
          helm repo add authentik https://charts.goauthentik.io
          helm repo add ot-helm https://ot-container-kit.github.io/helm-charts/
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        id: cr
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_SKIP_EXISTING: true

      - name: Login to GitHub Container Registry
        if: steps.cr.outputs.changed_charts != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Charts to GHCR
        if: steps.cr.outputs.changed_charts != ''
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*; do
            helm push "${pkg}" "oci://ghcr.io/${{ github.repository }}"
          done
