name: Security Scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan-all:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
      TRIVY_DB_REPOSITORY: public.shturval.tech/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.shturval.tech/trivy-java-db:1
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.76.0

      - name: Cache BDU vulxml
        uses: actions/cache@v4
        with:
          path: .cache/bdu
          key: bdu-vulxml-${{ hashFiles('scripts/scan/bdu-fetch.sh') }}
          restore-keys: |
            bdu-vulxml-

      - name: Fetch BDU database
        run: ./scripts/scan/bdu-fetch.sh

      - name: Scan all mirrored images
        id: scan
        continue-on-error: true
        env:
          SCAN_ENFORCE_GATE: "0"
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_JOB_NAME: scan-all
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/trivy-scan.sh all

      - name: Upload aggregate report
        if: always() && steps.scan.outcome != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report
          if-no-files-found: warn
          path: dist/scan/

      - name: Enforce scan policy gate
        if: always() && steps.scan.outcome != 'cancelled'
        env:
          SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/aggregate-report.sh
          ./scripts/scan/enforce-gate.sh dist/scan

      - name: Summary
        if: always()
        run: |
          if [[ -f dist/scan/REPORT.md ]]; then
            cat dist/scan/REPORT.md >> "${GITHUB_STEP_SUMMARY}"
          fi

  publish-pages:
    needs: scan-all
    if: always() && needs.scan-all.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      SCAN_FAIL_SEVERITY: ${{ vars.SCAN_FAIL_SEVERITY || 'CRITICAL' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download scan report
        uses: actions/download-artifact@v4
        with:
          name: security-scan-report
          path: dist/scan
          if-no-artifacts-found: ignore

      - name: Prepare report for Pages
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/aggregate-report.sh

      - name: Build GitHub Pages bundle
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_SOURCE: Security Scan
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x scripts/scan/*.sh
          ./scripts/scan/publish-pages.sh

      - name: Deploy to GitHub Pages (security/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/scan/pages
          destination_dir: security
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore(security): update scan report [skip ci]"
