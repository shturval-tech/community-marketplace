name: Reset GHCR Mirrors

# Delete all marketplace container packages, then run Mirror Images (fresh public packages).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  delete-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Delete mirrored container packages
        env:
          GH_TOKEN: ${{ secrets.GHCR_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/ghcr-delete-mirrors.sh
          CONFIRM=1 ./scripts/ghcr-delete-mirrors.sh --yes

  trigger-mirror:
    needs: delete-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Start Mirror Images workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Mirror Images" -R "${{ github.repository }}"
          echo "Triggered Mirror Images; track: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/images.yaml"
